[package]
name = "reth-state-store-qmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "QMDB-backed StateStore"

[lints]
workspace = true

[dependencies]
# reth
reth-primitives-traits.workspace = true
reth-state-store.workspace = true
reth-trie-common = { workspace = true, features = ["std"] }

# alloy
alloy-eips.workspace = true
alloy-primitives.workspace = true

# commonware, pinned by rev
commonware-codec = { git = "https://github.com/commonwarexyz/monorepo", rev = "9989e89e996cb0be88aad5c127c919726faa2d77" }
commonware-cryptography = { git = "https://github.com/commonwarexyz/monorepo", rev = "9989e89e996cb0be88aad5c127c919726faa2d77" }
commonware-parallel = { git = "https://github.com/commonwarexyz/monorepo", rev = "9989e89e996cb0be88aad5c127c919726faa2d77" }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", rev = "9989e89e996cb0be88aad5c127c919726faa2d77" }
commonware-storage = { git = "https://github.com/commonwarexyz/monorepo", rev = "9989e89e996cb0be88aad5c127c919726faa2d77" }

# misc
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

# qmdb-migrate
clap = { workspace = true, features = ["derive"], optional = true }
eyre = { workspace = true, optional = true }
reth-db = { workspace = true, features = ["mdbx"], optional = true }
reth-db-api = { workspace = true, optional = true }
reth-libmdbx = { workspace = true, optional = true }
reth-stages-types = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
cli = ["dep:clap", "dep:eyre", "dep:reth-db", "dep:reth-db-api", "dep:reth-libmdbx", "dep:reth-stages-types"]

[[bin]]
name = "qmdb-migrate"
required-features = ["cli"]
