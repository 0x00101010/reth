[package]
name = "reth-state-store-qmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "QMDB-backed StateStore"

[lints]
workspace = true

[dependencies]
# reth
reth-primitives-traits.workspace = true
reth-state-store.workspace = true
reth-trie-common = { workspace = true, features = ["std"] }

# alloy
alloy-eips.workspace = true
alloy-primitives.workspace = true

# commonware, pinned by rev
commonware-codec = { git = "https://github.com/0x00101010/monorepo", rev = "cd26a47ba83f426ec9d0082d5d86c1629c2ac212" }
commonware-cryptography = { git = "https://github.com/0x00101010/monorepo", rev = "cd26a47ba83f426ec9d0082d5d86c1629c2ac212" }
commonware-parallel = { git = "https://github.com/0x00101010/monorepo", rev = "cd26a47ba83f426ec9d0082d5d86c1629c2ac212" }
commonware-runtime = { git = "https://github.com/0x00101010/monorepo", rev = "cd26a47ba83f426ec9d0082d5d86c1629c2ac212" }
commonware-storage = { git = "https://github.com/0x00101010/monorepo", rev = "cd26a47ba83f426ec9d0082d5d86c1629c2ac212" }

# misc
parking_lot.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

# qmdb-migrate
clap = { workspace = true, features = ["derive"], optional = true }
eyre = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reth-db = { workspace = true, features = ["mdbx"], optional = true }
reth-db-api = { workspace = true, optional = true }
reth-libmdbx = { workspace = true, optional = true }
reth-stages-types = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
cli = [
    "dep:clap",
    "dep:eyre",
    "dep:rayon",
    "dep:reth-db",
    "dep:reth-db-api",
    "dep:reth-libmdbx",
    "dep:reth-stages-types",
]
# P=2 index partitions instead of P=3, for small-scale memory measurements only.
index-p2 = []

[[bin]]
name = "qmdb-migrate"
required-features = ["cli"]
